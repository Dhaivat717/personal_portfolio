name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Build as production: drafts off, no secrets. SITE_ENV stays unset here;
# SITE_ENV=production is set only in the Pages Production environment,
# where it also turns on analytics.
env:
  SHOW_DRAFTS: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Build tests (Seam 1)
        run: npm run test:build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 3

  contrast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Token-contrast checks
        run: npm run test:contrast

  site:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - run: npx playwright install --with-deps chromium
      - name: Site tests (Seam 2, against wrangler pages dev)
        run: npx playwright test --grep-invert "(axe accessibility audit|compressed size budgets)"

  axe:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - run: npx playwright install --with-deps chromium
      - name: axe-core accessibility audit
        run: npm run test:axe

  budgets:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - run: npx playwright install --with-deps chromium
      - name: Compressed size budgets
        run: npm run test:budgets

  lighthouse:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Lighthouse CI
        run: npm run test:lighthouse
