<!doctype html>
<!--
  PROTOTYPE — throwaway. Answers "Visual design direction: mockups to react to" (wayfinder ticket #11).
  Three visual directions plus D, the hybrid the owner picked, for the Home page and a Deep dive, switchable via ?variant=A|B|C|D and ?page=home|deep.
  Extra review toggles: ?photo=1 (show a photo slot), ?theme=auto|light|dark (the real site follows the system only).
  Run: open this file in a browser. Projects are PLACEHOLDERS (the projects ticket is still open).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE · dhaivat.dev visual directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ---------- shared reset + motion tokens (Material 3 standard/emphasized) ---------- */
*{box-sizing:border-box;margin:0;padding:0}
:root{--ease:cubic-bezier(.2,0,0,1);--ease-emph:cubic-bezier(.05,.7,.1,1);--dur:300ms;--dur-long:500ms;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;--wide:1068px;--narrow:734px}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--fg);line-height:1.55;-webkit-font-smoothing:antialiased;transition:background var(--dur) var(--ease),color var(--dur) var(--ease)}
a{color:inherit;text-decoration:none}
button,input,textarea{font:inherit;color:inherit}
.wrap{max-width:var(--wide);margin:0 auto;padding:0 22px}
.narrow{max-width:var(--narrow);margin:0 auto;padding:0 22px}
b,strong{font-weight:600;color:var(--fg-strong)}
.reveal{opacity:0;transform:translateY(14px);transition:opacity var(--dur-long) var(--ease-emph),transform var(--dur-long) var(--ease-emph)}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.reveal{opacity:1;transform:none;transition:none}*{animation:none!important}}

/* frosted nav (decided in Site structure) */
.nav{position:sticky;top:0;z-index:40;transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),backdrop-filter var(--dur);border-bottom:1px solid transparent}
.nav.scrolled{background:var(--glass);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom-color:var(--line)}
.nav .wrap{display:flex;align-items:center;gap:24px;height:52px}
.nav .brand{font-weight:600;margin-right:auto}
.nav .links{display:flex;gap:22px;align-items:center;font-size:14px;color:var(--muted)}
.nav .links a:hover{color:var(--fg)}
.dd{position:relative}
.dd-menu{position:absolute;top:30px;left:-12px;min-width:240px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 12px 32px rgba(0,0,0,.12);display:none}
.dd.open .dd-menu{display:block}
.dd-menu a{display:block;padding:8px 10px;border-radius:8px;color:var(--fg);font-size:14px}
.dd-menu a:hover{background:var(--hover)}
.dd-menu .all{color:var(--accent);border-top:1px solid var(--line);margin-top:4px;border-radius:0 0 8px 8px}
.dd-btn{background:none;border:0;cursor:pointer;color:inherit;padding:0 2px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:980px;padding:8px 16px;font-size:14px;font-weight:500;cursor:pointer;border:1px solid transparent;transition:transform 150ms var(--ease),background var(--dur)}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-ghost{border-color:var(--line);color:var(--fg)}
.footer{border-top:1px solid var(--line);margin-top:96px;padding:28px 0;color:var(--muted);font-size:13px}
.footer .wrap{display:flex;justify-content:space-between;align-items:center}
.footer .icons{display:flex;gap:16px}
.footer svg{width:18px;height:18px;fill:currentColor}
.photo{background:linear-gradient(135deg,var(--accent),var(--hover));display:grid;place-items:center;color:var(--on-accent);font-weight:600;flex:none}
@media (max-width:720px){.nav .links a.hide-m,.nav .links .dd{display:none}}

/* ---------- prototype-only switcher (not part of any design) ---------- */
#proto{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:999;display:flex;gap:6px;align-items:center;background:#111;color:#fff;border-radius:999px;padding:6px;font:500 12px/1 system-ui,sans-serif;box-shadow:0 8px 30px rgba(0,0,0,.35);border:1px solid #333;white-space:nowrap;max-width:calc(100vw - 16px);overflow-x:auto}
#proto button{background:#222;border:0;color:#fff;border-radius:999px;padding:8px 11px;cursor:pointer}
#proto button:hover{background:#333}
#proto .lbl{padding:0 8px;min-width:150px;text-align:center}
#proto .on{background:#fff;color:#111}

/* ---------- ⌘K palette (B and C) ---------- */
#palette{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.35);display:none;align-items:flex-start;justify-content:center;padding-top:14vh}
#palette.open{display:flex}
#palette .box{width:min(560px,92vw);background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.3);font-family:var(--mono)}
#palette input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:16px;font-family:var(--mono);font-size:15px;outline:none}
#palette a{display:flex;justify-content:space-between;padding:10px 16px;font-size:13px;color:var(--fg)}
#palette a:hover,#palette a.sel{background:var(--hover)}
#palette a span{color:var(--muted)}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--muted)}

/* =====================================================================
   VARIANT A — "Keynote": Apple-clean, one blue accent, light dev touch
   ===================================================================== */
.vA{--bg:#fff;--fg:#1d1d1f;--fg-strong:#000;--muted:#6e6e73;--line:#d2d2d7;--surface:#fff;--hover:#f5f5f7;--glass:rgba(255,255,255,.72);--accent:#0071e3;--on-accent:#fff;--tile:#f5f5f7}
.dark .vA{--bg:#000;--fg:#f5f5f7;--fg-strong:#fff;--muted:#a1a1a6;--line:#38383d;--surface:#1c1c1e;--hover:#2c2c2e;--glass:rgba(0,0,0,.66);--accent:#2997ff;--tile:#161617}
.vA h1{font-size:clamp(44px,7vw,80px);font-weight:700;letter-spacing:-.035em;line-height:1.04}
.vA h2{font-size:clamp(32px,4.5vw,48px);font-weight:700;letter-spacing:-.03em;line-height:1.08;margin-bottom:40px}
.vA .hero{text-align:center;padding:112px 0 72px}
.vA .hero .photo{width:88px;height:88px;border-radius:50%;margin:0 auto 28px;font-size:28px}
.vA .hero p.lede{font-size:clamp(19px,2.2vw,24px);color:var(--muted);max-width:620px;margin:20px auto 32px;letter-spacing:-.01em}
.vA .hero .cta{display:flex;gap:12px;justify-content:center}
.vA .snippet{margin:56px auto 0;max-width:520px;text-align:left;background:var(--tile);border-radius:18px;padding:20px 22px;font-family:var(--mono);font-size:13.5px;line-height:1.7;color:var(--muted);min-height:120px}
.vA .snippet .k{color:var(--accent)}.vA .snippet .s{color:var(--fg)}
.vA section{padding:96px 0;scroll-margin-top:52px}
.vA .role{display:grid;grid-template-columns:180px 1fr;gap:32px;padding:36px 0;border-top:1px solid var(--line)}
.vA .role .when{color:var(--muted);font-size:15px}
.vA .role h3{font-size:24px;letter-spacing:-.02em;font-weight:600}
.vA .role .title{color:var(--muted);margin-bottom:16px}
.vA .role ul{list-style:none;display:grid;gap:12px;font-size:17px}
.vA .role li{padding-left:20px;position:relative}
.vA .role li:before{content:"";position:absolute;left:2px;top:.7em;width:6px;height:6px;border-radius:50%;background:var(--line)}
.vA .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.vA .tags span{font-size:12px;background:var(--tile);border-radius:980px;padding:5px 12px;color:var(--muted)}
.vA .tiles{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.vA .tile{background:var(--tile);border-radius:24px;padding:36px;min-height:340px;display:flex;flex-direction:column;transition:transform var(--dur) var(--ease)}
.vA .tile:hover{transform:scale(1.012)}
.vA .tile h3{font-size:28px;letter-spacing:-.025em}
.vA .tile p{color:var(--muted);margin:8px 0 auto}
.vA .tile .art{height:150px;border-radius:14px;margin-top:24px;background:linear-gradient(135deg,var(--accent) -40%,transparent 70%),var(--bg);opacity:.9}
.vA .more{display:inline-block;margin-top:28px;color:var(--accent);font-size:17px}
.vA form{display:grid;gap:14px;max-width:560px}
.vA input,.vA textarea{background:var(--tile);border:1px solid transparent;border-radius:12px;padding:14px 16px;font-size:17px;outline:none;transition:border-color var(--dur)}
.vA input:focus,.vA textarea:focus{border-color:var(--accent)}
.vA .center{text-align:center}.vA .center form{margin:0 auto}
/* A deep dive */
.vA .dd-head{padding:64px 0 40px}
.vA .back{color:var(--accent);font-size:15px}
.vA .dd-head h1{font-size:clamp(40px,6vw,64px);margin:20px 0 14px}
.vA .meta{display:flex;flex-wrap:wrap;gap:28px;color:var(--muted);font-size:14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px 0;margin-top:28px}
.vA .meta b{display:block;color:var(--fg);font-weight:500}
.vA .heroimg{height:420px;border-radius:28px;background:linear-gradient(135deg,var(--accent) -30%,var(--tile) 60%);margin:24px auto 64px;max-width:var(--wide)}
.vA article h2{font-size:32px;margin:56px 0 16px}
.vA article p{font-size:19px;margin-bottom:18px;color:var(--fg)}
.vA article pre{background:var(--tile);border-radius:14px;padding:18px;font:13.5px/1.6 var(--mono);overflow:auto;margin:20px 0}
.vA .diagram{background:var(--tile);border-radius:18px;padding:24px;margin:24px 0}
.vA .pager{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:72px;padding-top:24px;color:var(--accent)}
@media (max-width:720px){.vA .role{grid-template-columns:1fr;gap:6px}.vA .tiles{grid-template-columns:1fr}}

/* =====================================================================
   VARIANT B — "Editor": developer-forward, mono accents, editor hero, ⌘K
   ===================================================================== */
.vB{--bg:#fafafa;--fg:#18181b;--fg-strong:#09090b;--muted:#71717a;--line:#e4e4e7;--surface:#fff;--hover:#f4f4f5;--glass:rgba(250,250,250,.75);--accent:#0d9488;--on-accent:#fff;--code-bg:#0f1115}
.dark .vB{--bg:#0b0d10;--fg:#e4e4e7;--fg-strong:#fafafa;--muted:#8b8b94;--line:#22252b;--surface:#13161a;--hover:#1b1f24;--glass:rgba(11,13,16,.72);--accent:#2dd4bf;--on-accent:#04201d;--code-bg:#0f1115}
.vB .lbl{font-family:var(--mono);font-size:13px;color:var(--accent);margin-bottom:14px;display:block}
.vB h1{font-size:clamp(38px,5.2vw,60px);font-weight:600;letter-spacing:-.035em;line-height:1.06}
.vB h2{font-size:clamp(28px,3.6vw,40px);font-weight:600;letter-spacing:-.03em;margin-bottom:36px}
.vB .hero{display:grid;grid-template-columns:1fr 1.05fr;gap:48px;align-items:center;padding:88px 0 64px}
.vB .hero .photo{width:56px;height:56px;border-radius:14px;margin-bottom:24px}
.vB .hero p{font-size:19px;color:var(--muted);margin:20px 0 28px;max-width:460px}
.vB .hero .cta{display:flex;gap:10px;flex-wrap:wrap}
.vB .btn{border-radius:10px}
.vB .editor{background:var(--code-bg);border-radius:14px;border:1px solid #23262d;overflow:hidden;box-shadow:0 30px 60px -20px rgba(0,0,0,.35);color:#c9d1d9;font:13.5px/1.75 var(--mono)}
.vB .editor .bar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#161a20;border-bottom:1px solid #23262d}
.vB .editor .dot{width:11px;height:11px;border-radius:50%;background:#3a3f47}
.vB .editor .tab{margin-left:12px;font-size:12px;color:#8b949e;background:#0f1115;padding:4px 10px;border-radius:6px}
.vB .editor pre{padding:18px 20px;min-height:250px;white-space:pre-wrap}
.vB .editor .ln{color:#3d444d;user-select:none;display:inline-block;width:22px}
.vB .editor .k{color:#ff7b72}.vB .editor .p{color:#79c0ff}.vB .editor .s{color:#a5d6ff}.vB .editor .n{color:#ffa657}.vB .editor .c{color:#6e7681}
.vB .cursor{display:inline-block;width:8px;height:17px;background:#2dd4bf;vertical-align:-3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.vB section{padding:88px 0;scroll-margin-top:52px;border-top:1px solid var(--line)}
.vB .xp{display:grid;grid-template-columns:240px 1fr;gap:40px}
.vB .xp-tabs{display:flex;flex-direction:column;border-left:2px solid var(--line)}
.vB .xp-tabs button{background:none;border:0;text-align:left;padding:12px 16px;margin-left:-2px;border-left:2px solid transparent;cursor:pointer;color:var(--muted);transition:color var(--dur),border-color var(--dur),background var(--dur)}
.vB .xp-tabs button small{display:block;font-family:var(--mono);font-size:11.5px}
.vB .xp-tabs button.on{color:var(--fg);border-left-color:var(--accent);background:var(--hover)}
.vB .xp-panel h3{font-size:22px;font-weight:600;letter-spacing:-.02em}
.vB .xp-panel h3 span{color:var(--accent)}
.vB .xp-panel .when{font-family:var(--mono);font-size:13px;color:var(--muted);margin:4px 0 20px}
.vB .xp-panel ul{list-style:none;display:grid;gap:14px;font-size:16.5px}
.vB .xp-panel li{padding-left:22px;position:relative}
.vB .xp-panel li:before{content:"▹";position:absolute;left:0;color:var(--accent)}
.vB .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:22px}
.vB .tags span{font:12px var(--mono);border:1px solid var(--line);border-radius:6px;padding:3px 8px;color:var(--muted)}
.vB .plist a{display:grid;grid-template-columns:48px 1fr auto;gap:18px;align-items:center;padding:22px 8px;border-bottom:1px solid var(--line);transition:background var(--dur),padding var(--dur) var(--ease)}
.vB .plist a:hover{background:var(--hover);padding-left:16px}
.vB .plist .ic{width:48px;height:48px;border-radius:12px;background:var(--hover);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--mono);color:var(--accent)}
.vB .plist h3{font-size:18px;font-weight:600}
.vB .plist p{color:var(--muted);font-size:15px}
.vB .plist .go{font-family:var(--mono);color:var(--muted);font-size:13px}
.vB .more{display:inline-block;margin-top:22px;font-family:var(--mono);font-size:14px;color:var(--accent)}
.vB form{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:680px}
.vB form label{font:12px var(--mono);color:var(--muted);display:grid;gap:6px}
.vB form .full{grid-column:1/-1}
.vB input,.vB textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:15px;outline:none}
.vB input:focus,.vB textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.vB .kbtn{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:12px;color:var(--muted);cursor:pointer;background:var(--surface)}
/* B deep dive */
.vB .dd-grid{display:grid;grid-template-columns:200px 1fr;gap:56px;padding:56px 0}
.vB .toc{position:sticky;top:76px;align-self:start;font-size:14px}
.vB .toc a{display:block;padding:6px 0 6px 12px;color:var(--muted);border-left:2px solid var(--line)}
.vB .toc a:first-of-type{color:var(--fg);border-left-color:var(--accent)}
.vB .back{font-family:var(--mono);font-size:13px;color:var(--muted);display:block;margin-bottom:28px}
.vB article{max-width:var(--narrow)}
.vB article h1{font-size:clamp(34px,4.6vw,52px)}
.vB article .sum{font-size:20px;color:var(--muted);margin:14px 0 24px}
.vB .meta{display:grid;grid-template-columns:repeat(4,auto);gap:4px 28px;font-size:14px;padding:16px 0;border-block:1px solid var(--line);margin-bottom:40px}
.vB .meta small{font:11.5px var(--mono);color:var(--muted);display:block}
.vB article h2{font-size:26px;margin:48px 0 14px}
.vB article p{font-size:17px;margin-bottom:16px}
.vB article pre{background:var(--code-bg);color:#c9d1d9;border-radius:12px;padding:18px;font:13px/1.65 var(--mono);overflow:auto;margin:20px 0;border:1px solid #23262d}
.vB .diagram{border:1px solid var(--line);border-radius:12px;padding:20px;margin:20px 0;background:var(--surface)}
.vB .pager{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:64px}
.vB .pager a{border:1px solid var(--line);border-radius:12px;padding:16px;font-size:15px}
.vB .pager small{font:12px var(--mono);color:var(--muted);display:block}
.vB .pager a:last-child{text-align:right}
@media (max-width:820px){.vB .hero,.vB .xp,.vB .dd-grid{grid-template-columns:1fr}.vB .toc{display:none}.vB .xp-tabs{flex-direction:row;overflow:auto;border-left:0;border-bottom:2px solid var(--line)}.vB .xp-tabs button{border-left:0;border-bottom:2px solid transparent;margin:0 0 -2px}.vB .xp-tabs button.on{border-bottom-color:var(--accent)}.vB form{grid-template-columns:1fr}.vB .meta{grid-template-columns:1fr 1fr}}

/* =====================================================================
   VARIANT C — "Terminal": clearly code-flavored, mono headings, amber
   ===================================================================== */
.vC{--bg:#f6f4ef;--fg:#1c1b19;--fg-strong:#000;--muted:#7a756c;--line:#ddd8cd;--surface:#fffdf8;--hover:#ece8de;--glass:rgba(246,244,239,.8);--accent:#b45309;--on-accent:#fff;--term:#fffdf8}
.dark .vC{--bg:#0c0c0b;--fg:#e8e6e1;--fg-strong:#fff;--muted:#8a857b;--line:#26241f;--surface:#151412;--hover:#1e1c19;--glass:rgba(12,12,11,.78);--accent:#f5a524;--on-accent:#1a1205;--term:#121110}
.vC .nav .brand,.vC .nav .links{font-family:var(--mono);font-size:13px}
.vC .nav .brand:before{content:"~/";color:var(--accent)}
.vC .btn{border-radius:6px;font-family:var(--mono);font-size:13px}
.vC h2{font:600 15px var(--mono);color:var(--muted);margin-bottom:28px;letter-spacing:0}
.vC h2:before{content:"$ ";color:var(--accent)}
.vC .hero{padding:72px 0 40px}
.vC .term{background:var(--term);border:1px solid var(--line);border-radius:10px;font:15px/1.8 var(--mono);overflow:hidden}
.vC .term .bar{padding:8px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.vC .term .body{padding:22px 24px 28px;display:grid;grid-template-columns:1fr auto;gap:28px}
.vC .term .pr{color:var(--accent)}
.vC .term .out{color:var(--fg);margin-bottom:10px}
.vC .term .big{font:700 clamp(30px,5vw,52px)/1.1 var(--mono);letter-spacing:-.03em;color:var(--fg-strong);margin:6px 0 14px}
.vC .term .photo{width:132px;height:160px;border-radius:6px;border:1px dashed var(--accent);background:repeating-linear-gradient(0deg,var(--hover) 0 2px,transparent 2px 4px);color:var(--accent);font-size:12px}
.vC .cursor{display:inline-block;width:9px;height:18px;background:var(--accent);vertical-align:-3px;animation:blink 1s steps(1) infinite}
.vC .cta{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.vC section{padding:72px 0;scroll-margin-top:52px}
.vC .log{position:relative;padding-left:28px}
.vC .log:before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:var(--line)}
.vC .commit{position:relative;padding-bottom:44px}
.vC .commit:before{content:"";position:absolute;left:-27px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--accent)}
.vC .commit:first-child:before{background:var(--accent)}
.vC .commit .hd{font:13px var(--mono);color:var(--muted)}
.vC .commit .hd .ref{color:var(--accent)}
.vC .commit h3{font:600 22px var(--mono);letter-spacing:-.02em;margin:4px 0 14px}
.vC .commit ul{list-style:none;display:grid;gap:10px;font-size:16.5px;max-width:780px}
.vC .commit li{padding-left:22px;position:relative}
.vC .commit li:before{content:"+";position:absolute;left:0;font-family:var(--mono);color:var(--accent)}
.vC .tags{font:12.5px var(--mono);color:var(--muted);margin-top:14px}

/* ------------------------------ render ------------------------------ */
const V = {A,B,C,D};
function applyTheme(){
  const dark = S.theme==="dark" || (S.theme==="auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.classList.toggle("dark", dark);
}
function syncURL(){ const q=new URLSearchParams({variant:S.variant,page:S.page}); if(S.photo)q.set("photo","1"); if(S.theme!=="auto")q.set("theme",S.theme); history.replaceState(null,"","?"+q); }
let typer;
function render(){
  if(!V[S.variant]) S.variant="A";
  document.body.className = S.variant==="D" ? "vA vD" : "v"+S.variant;
  document.getElementById("root").innerHTML = V[S.variant][S.page==="deep"?"deep":"home"]();
  applyTheme(); syncURL(); proto(); wire(); window.scrollTo(0,0);
}

function wire(){
  const nv=document.querySelector(".nav"); const onS=()=>nv&&nv.classList.toggle("scrolled",scrollY>8); onS(); window.onscroll=onS;
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12});
  document.querySelectorAll(".reveal").forEach(el=>io.observe(el));
  document.querySelectorAll("[data-deep]").forEach(a=>a.onclick=e=>{e.preventDefault();S.page="deep";render()});
  document.querySelectorAll("[data-home]").forEach(a=>a.onclick=e=>{e.preventDefault();const id=a.dataset.home;if(S.page!=="home"){S.page="home";render()}requestAnimationFrame(()=>{const t=document.getElementById(id);t&&t.scrollIntoView()})});
  document.querySelectorAll(".dd-btn").forEach(b=>b.onclick=e=>{e.stopPropagation();b.parentElement.classList.toggle("open")});
  document.querySelectorAll(".dd").forEach(d=>{d.onmouseenter=()=>matchMedia("(hover:hover)").matches&&d.classList.add("open");d.onmouseleave=()=>d.classList.remove("open")});
  document.querySelectorAll("[data-palette]").forEach(b=>b.onclick=openPalette);
  // B: experience tabs
  const panel=document.querySelector(".vB .xp-panel");
  if(panel){const show=i=>{const r=roles[i];panel.innerHTML=`<h3>${r.title} <span>@ ${r.co}</span></h3><div class="when">${r.when}</div><ul>${r.bullets.map(b=>`<li>${b}</li>`).join("")}</ul>${r.tags.length?`<div class="tags">${r.tags.map(t=>`<span>${t}</span>`).join("")}</div>`:''}`;document.querySelectorAll("[data-xp]").forEach(x=>x.classList.toggle("on",+x.dataset.xp===i))};show(0);document.querySelectorAll("[data-xp]").forEach(x=>x.onclick=()=>show(+x.dataset.xp))}
  // typed hero touches
  clearInterval(typer);
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const t=document.querySelector("[data-type]"); if(!t) return;
  const scripts={
    a:[['k','const'],['s',' engineer = {\n  '],['s','team: '],['k','"Amazon Ads"'],['s',',\n  ships: ['],['k','"APIs"'],['s',', '],['k','"migrations"'],['s',', '],['k','"agents"'],['s','],\n  scale: '],['k','"worldwide"'],['s','\n};']],
    b:[['c','// dhaivat.ts\n'],['k','export const'],['s',' '],['n','dhaivat'],['s',' = {\n  '],['p','role'],['s',': '],['s','"Software Engineer"'],['s',',\n  '],['p','at'],['s',': '],['s','"Amazon Ads"'],['s',',\n  '],['p','focus'],['s',': ['],['s','"APIs"'],['s',', '],['s','"migrations"'],['s',', '],['s','"LLM agents"'],['s','],\n  '],['p','shipped'],['s',': { '],['p','marketplaces'],['s',': '],['n','19'],['s',', '],['p','bugsCaughtPreGA'],['s',': '],['n','63'],['s',' },\n  '],['p','openTo'],['s',': '],['s','"interesting problems"'],['s','\n};']],
    c:[['s','open ./experience ./projects']],
    d:[['k','## '],['n',"Hi, I'm Dhaivat.\n"],['s',"I'm a software engineer on "],['b','Amazon Ads'],['s',", where I build the\nAPIs and platforms advertisers use in "],['b','19+ new marketplaces'],['s','.\n\n'],
       ['k','## '],['n','Lately\n'],['p','- '],['s','an LLM on-call agent that ran '],['b','1,000+ investigations'],['s',' in two weeks\n'],['p','- '],['s','a parity gate that caught '],['b','63 bugs before GA'],['s','\n'],['p','- '],['s','API fan-out cut from '],['b','1,000 calls to 4'],['s','\n\n'],
       ['k','## '],['n','Off the clock\n'],['c','<placeholder: what you build or learn for fun>\n\n'],
       ['k','## '],['n','How I work\n'],['c','<placeholder: one line, e.g. "remove work before adding capacity">']]
  }[t.dataset.type];
  const full=scripts.map(([c,s])=>({c,s}));
  let ci=0,k=0;
  const paint=()=>{let h="";for(let i=0;i<full.length;i++){const s=i<ci?full[i].s:i===ci?full[i].s.slice(0,k):"";if(!s)continue;h+=`<span class="${full[i].c}">${s.replace(/</g,"&lt;")}</span>`}t.innerHTML=h+("bd".includes(t.dataset.type)?'<span class="cursor"></span>':'')};
  if(reduce){ci=full.length;paint();return}
  typer=setInterval(()=>{if(ci>=full.length){clearInterval(typer);return}k+=(t.dataset.type==="d"?2:1);if(k>full[ci].s.length){ci++;k=0}paint()},28);
}

/* ------------------------------ ⌘K palette ------------------------------ */
const cmds=[["Go to Experience","home:experience"],["Go to Projects","home:projects"],["Go to Contact","home:contact"],...projects.map(p=>["Open "+p.name,"deep"]),["Download résumé","noop"],["Copy page link","noop"]];
const pal=document.getElementById("palette"),pin=pal.querySelector("input"),pitems=pal.querySelector(".items");
function drawPal(){const q=pin.value.toLowerCase();pitems.innerHTML=cmds.filter(c=>c[0].toLowerCase().includes(q)).map((c,i)=>`<a href="#" class="${i?'':'sel'}" data-c="${c[1]}">${c[0]}<span>↵</span></a>`).join("");pitems.querySelectorAll("a").forEach(a=>a.onclick=e=>{e.preventDefault();runCmd(a.dataset.c)})}
function openPalette(){if(S.variant==="A"||S.variant==="D")return;pal.classList.add("open");pin.value="";drawPal();pin.focus()}
function runCmd(c){pal.classList.remove("open");if(c.startsWith("home:")){const id=c.slice(5);if(S.page!=="home"){S.page="home";render()}requestAnimationFrame(()=>document.getElementById(id)?.scrollIntoView())}else if(c==="deep"){S.page="deep";render()}}
pin.oninput=drawPal;pin.onkeydown=e=>{if(e.key==="Enter"){const s=pitems.querySelector("a");s&&runCmd(s.dataset.c)}if(e.key==="Escape")pal.classList.remove("open")};
pal.onclick=e=>{if(e.target===pal)pal.classList.remove("open")};

/* ------------------------------ prototype switcher ------------------------------ */
function proto(){
  const el=document.getElementById("proto");
  el.innerHTML=`<button data-p="prev" aria-label="Previous variant">←</button><span class="lbl">${S.variant} · ${names[S.variant]}</span><button data-p="next" aria-label="Next variant">→</button>
   <button data-p="page" class="${S.page==='home'?'on':''}">Home</button><button data-p="page" class="${S.page==='deep'?'on':''}">Deep dive</button>
   <button data-p="photo" class="${S.photo?'on':''}">Photo</button><button data-p="theme">Theme: ${S.theme}</button>`;
  el.querySelectorAll("button").forEach(b=>b.onclick=()=>{const p=b.dataset.p;
    if(p==="prev"||p==="next")cycle(p==="next"?1:-1);
    else if(p==="page"){S.page=b.textContent==="Home"?"home":"deep";render()}
    else if(p==="photo"){S.photo=!S.photo;render()}
    else if(p==="theme"){S.theme={auto:"light",light:"dark",dark:"auto"}[S.theme];applyTheme();syncURL();proto()}});
}
function cycle(d){const ks=["A","B","C","D"];S.variant=ks[(ks.indexOf(S.variant)+d+4)%4];render()}
document.addEventListener("keydown",e=>{
  const tag=(document.activeElement||{}).tagName; const typing=tag==="INPUT"||tag==="TEXTAREA"||document.activeElement?.isContentEditable;
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openPalette();return}
  if(typing)return;
  if(e.key==="ArrowRight")cycle(1); if(e.key==="ArrowLeft")cycle(-1);
});
document.addEventListener("click",()=>document.querySelectorAll(".dd.open").forEach(d=>d.classList.remove("open")));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",applyTheme);
render();
</script>
